name: Validate design packages
on:
  push:
    branches: [main]
    paths: ['catalog.json', 'entries/**', 'exports/**', 'tools/**', 'tests/**', 'evals/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['catalog.json', 'entries/**', 'exports/**', 'tools/**', 'tests/**', 'evals/**', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python tools/export.py --check
      - run: python -m unittest discover -s tests -v
